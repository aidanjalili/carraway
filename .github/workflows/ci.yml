name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

  # CI only ever installed editable, which does not exercise the wheel build.
  # A packaging bug therefore stayed invisible until the first real install:
  # a redundant force-include made hatchling add one file twice and fail
  # outright. This job builds the wheel the way `pip install` from git does.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it clean, and check the icon shipped
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import carraway; print(carraway.__name__, 'imports')"
          /tmp/fresh/bin/python - <<'PY'
          from importlib.resources import files
          icon = files("carraway.ui.assets") / "carraway.svg"
          assert icon.is_file(), "the window icon did not ship in the wheel"
          print("icon shipped:", icon)
          PY
