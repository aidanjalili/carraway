name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The pocket extra too: the vault encrypts real data and its tests
          # need the real cipher, not a skip. Qt is left out on purpose --
          # the GUI tests skip without it, which keeps this job quick.
          pip install -e '.[dev,pocket]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

  # CI only ever installed editable, which does not exercise the wheel build.
  # A packaging bug therefore stayed invisible until the first real install:
  # a redundant force-include made hatchling add one file twice and fail
  # outright. This job builds the wheel the way `pip install` from git does.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it clean, and check the icon shipped
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import carraway; print(carraway.__name__, 'imports')"
          /tmp/fresh/bin/python - <<'PY'
          from importlib.resources import files

          # Addressed as a directory inside carraway.ui, not as the package
          # carraway.ui.assets. That package's __init__ imports PySide6 to
          # build a QIcon, and a Qt-free install is the whole point of this
          # job -- so asking the other way fails on the import rather than
          # telling you anything about whether the file shipped.
          icon = files("carraway.ui") / "assets" / "carraway.svg"
          assert icon.is_file(), "the window icon did not ship in the wheel"
          print("icon shipped:", icon)

          # And the engine must stay importable with no Qt at all, which is
          # the promise that makes the CLI installable on a headless box.
          import carraway.core.db
          import carraway.analysis.overview
          import carraway.sync.pocket
          print("core imports with no Qt installed")
          PY
