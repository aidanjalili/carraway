<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A rising line on a rounded card.

       Drawn heavier than it needs to be at 128px, because the size that
       actually matters is 16-24px in a taskbar. At that scale a hairline
       stroke turns to mush and small details read as noise, so there are no
       small details: one thick polyline, one dot, nothing else. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333b47"/>
      <stop offset="1" stop-color="#1b1f26"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#card)"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none"
        stroke="#454e5d" stroke-width="2"/>

  <polyline points="26,94 52,66 74,80 102,34"
            fill="none" stroke="#4ade80" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="102" cy="34" r="11" fill="#4ade80"/>
</svg>
