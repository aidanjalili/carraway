[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carraway"
version = "0.1.0"
description = "A local-first, open source money manager and subscription tracker"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "aidanjalili" }]
keywords = ["finance", "budgeting", "subscriptions", "personal-finance", "privacy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# The core deliberately has zero runtime dependencies: standard library only.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# Bank sync needs no HTTP library — urllib does the job — but a secret belongs
# in the OS keyring rather than a file. Optional, with a documented fallback.
sync = ["keyring>=24.0"]
# Carraway Pocket puts a copy of your history on a server you run. It is
# encrypted here first, with a key that server never sees, and AES-GCM is not
# something to hand-roll -- so the one real cryptographic dependency.
pocket = ["keyring>=24.0", "cryptography>=42.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
carraway = "carraway.cli:main"
carraway-gui = "carraway.ui.app:main"

[project.urls]
Homepage = "https://github.com/aidanjalili/carraway"
Issues = "https://github.com/aidanjalili/carraway/issues"

[tool.hatch.build.targets.wheel]
# The window icon lives inside the package tree and is picked up with
# everything else, so an install without a desktop entry still shows
# something in the taskbar. It used to be force-included as well, which made
# hatchling add ui/assets/__init__.py twice and fail the build outright — but
# only for a real install, never for the editable one used in development.
packages = ["src/carraway"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules --ignore=src/carraway/cli.py --ignore=src/carraway/ui --ignore=src/carraway/sync/cli.py"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
